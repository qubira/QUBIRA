<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Próximamente · QUBIRA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #060c16;
      --card: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.08);
      --primary: #1f7ae0;
      --primary-2: #4fb0ff;
      --accent: #77f2c8;
      --text: #e8f0ff;
      --muted: rgba(200,218,255,0.55);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: "DM Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 45% at 80% 5%,  rgba(31,122,224,0.18), transparent),
        radial-gradient(ellipse 50% 40% at 10% 90%, rgba(119,242,200,0.08), transparent),
        radial-gradient(ellipse 40% 35% at 55% 50%, rgba(123,97,255,0.06),  transparent);
    }
    .card {
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 52px 48px;
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .emoji {
      font-size: 3.5rem;
      line-height: 1;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(79,176,255,0.12);
      border: 1px solid rgba(79,176,255,0.25);
      color: var(--primary-2);
    }
    h1 {
      font-family: "Syne", sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    h1 span { color: var(--primary-2); }
    p {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.6;
      max-width: 340px;
    }
    .divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, var(--primary-2), var(--accent));
      border-radius: 2px;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      border-radius: 3px;
      animation: fillBar 1.8s cubic-bezier(.22,.61,.36,1) forwards;
    }
    @keyframes fillBar {
      to { width: 35%; }
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: rgba(31,122,224,0.15);
      border: 1px solid rgba(79,176,255,0.3);
      border-radius: 12px;
      color: var(--primary-2);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      margin-top: 8px;
    }
    .back-btn:hover {
      background: rgba(31,122,224,0.25);
      border-color: rgba(79,176,255,0.5);
      transform: translateY(-1px);
    }
    .back-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="emoji" id="emoji">🚧</div>
    <div class="badge" id="tipo-badge">📋 Módulo</div>
    <h1 id="titulo">Maqueta<br/><span id="industria-nombre">Próximamente</span></h1>
    <div class="divider"></div>
    <p id="descripcion">
      Estamos desarrollando esta maqueta. Pronto estará disponible para que puedas visualizar el aplicativo.
    </p>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
    <a class="back-btn" href="../../../control.html">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      Volver al Panel
    </a>
  </div>

  <script>
    const INDUSTRIAS = {
      ferreteria:  { nombre: "Ferreterías",           emoji: "🔧" },
      restaurante: { nombre: "Restaurantes",           emoji: "🍽️" },
      heladeria:   { nombre: "Heladerías",             emoji: "🍦" },
      farmacia:    { nombre: "Farmacias",              emoji: "💊" },
      gimnasio:    { nombre: "Gimnasios",              emoji: "🏋️" },
      tienda:      { nombre: "Tiendas",                emoji: "🛍️" },
      minimarket:  { nombre: "Mini Markets",           emoji: "🏪" },
      bulevar:     { nombre: "Bulevares",              emoji: "🌆" },
      discoteca:   { nombre: "Discotecas",             emoji: "🪩" },
      lavanderia:  { nombre: "Lavanderías",            emoji: "🧺" },
      petshop:     { nombre: "Pet Shops",              emoji: "🐾" },
      veterinaria: { nombre: "Veterinarias",           emoji: "🐶" },
      peluqueria:  { nombre: "Peluquerías",            emoji: "✂️" },
      spa:         { nombre: "Spas",                   emoji: "🧘" },
      tecnologia:  { nombre: "Tiendas de Tecnología",  emoji: "💻" },
      clinica:     { nombre: "Clínicas Dentales",      emoji: "🦷" },
      licorera:    { nombre: "Licoreras",              emoji: "🥃" },
      colegio:     { nombre: "Colegios",               emoji: "🎓" },
      guarderia:   { nombre: "Guarderías",             emoji: "🧒" },
      trajes:      { nombre: "Alquiler de Trajes",     emoji: "👔" },
      fotografia:  { nombre: "Estudios Fotográficos",  emoji: "📸" },
      eventos:     { nombre: "Organizadores de Eventos", emoji: "🎉" },
      carpinteria: { nombre: "Taller de Carpintería",  emoji: "🪵" },
      optica:      { nombre: "Ópticas",                emoji: "👓" },
      hotel:       { nombre: "Hoteles",                emoji: "🏨" },
    };
    const TIPOS = {
      web:        { label: "Aplicativo Web",         icon: "🌐" },
      escritorio: { label: "Aplicativo Escritorio",  icon: "🖥️" },
      movil:      { label: "Aplicativo Móvil",       icon: "📱" },
      enterprise: { label: "Proyecto Gran Escala",   icon: "🏢" },
    };

    const params = new URLSearchParams(location.search);
    const ind  = params.get("industria") || "";
    const tipo = params.get("tipo")      || "";

    const info   = INDUSTRIAS[ind];
    const tipoInfo = TIPOS[tipo];

    if (info) {
      document.getElementById("emoji").textContent = info.emoji;
      document.getElementById("industria-nombre").textContent = info.nombre;
      document.title = `${info.nombre} · Próximamente · QUBIRA`;
    }
    if (tipoInfo) {
      document.getElementById("tipo-badge").textContent = `${tipoInfo.icon} ${tipoInfo.label}`;
    }
  </script>
</body>
</html>
